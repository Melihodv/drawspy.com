# ─── DrawSpy Nginx Configuration ─────────────────────────────────────────────
# Copy to: /etc/nginx/sites-available/drawspy
# Enable: ln -s /etc/nginx/sites-available/drawspy /etc/nginx/sites-enabled/
# Test:   nginx -t
# Reload: systemctl reload nginx

# Redirect HTTP → HTTPS
server {
    listen 80;
    server_name drawspy.com www.drawspy.com;
    return 301 https://$host$request_uri;
}

# Main HTTPS server (frontend via Vercel/CDN, backend via this proxy)
server {
    listen 443 ssl http2;
    server_name drawspy.com www.drawspy.com;

    # ─── SSL (Let's Encrypt / Certbot) ─────────────────────────────────────
    ssl_certificate     /etc/letsencrypt/live/drawspy.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/drawspy.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # ─── Security Headers ───────────────────────────────────────────────────
    add_header X-Frame-Options DENY;
    add_header X-Content-Type-Options nosniff;
    add_header X-XSS-Protection "1; mode=block";
    add_header Referrer-Policy no-referrer-when-downgrade;

    # ─── Game Server API + WebSocket ────────────────────────────────────────
    location /socket.io/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;

        # WebSocket upgrade headers (REQUIRED)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts for long-lived WebSocket connections
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_connect_timeout 10s;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # API rate limit (via nginx)
        limit_req zone=api burst=20 nodelay;
    }

    location /health {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }

    # Frontend (Vercel) — proxy all other traffic
    # Alternatively, use Vercel's domain directly and only proxy /api + /socket.io here
    location / {
        # If self-hosting Next.js:
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ─── Rate limiting zone ──────────────────────────────────────────────────────
# Add this to the http{} block in /etc/nginx/nginx.conf:
# limit_req_zone $binary_remote_addr zone=api:10m rate=30r/m;
